    Snapshot:
      type: object
      properties:
        retentionFrontier:
          type: string
          pattern: ^[0-9]+$
        workspace:
          $ref: '#/components/schemas/Workspace'
        snapshotSeq:
          type: string
          pattern: ^[0-9]+$
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        activeRuns:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
      required:
      - retentionFrontier
      - workspace
      - snapshotSeq
      - agents
      - channels
      - hosts
      - activeRuns
      - approvals
      additionalProperties: false
    Login:
      type: object
      properties:
        oneTimeToken:
          type: string
      required:
      - oneTimeToken
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        authenticated:
          type: boolean
        csrfToken:
          type: string
      required:
      - authenticated
      - csrfToken
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          type: string
      required:
      - status
      - version
      additionalProperties: false
    RegisterArtifact:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        localPath:
          type: string
        kind:
          type: string
          enum:
          - file
          - image
          - diff
          - test_report
          - log
          - context
        filename:
          type: string
      required:
      - runId
      - localPath
      - kind
      - filename
      additionalProperties: false
    AckInbox:
      type: object
      properties:
        deliveryIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        contextDigest:
          type: string
      required:
      - deliveryIds
      - contextDigest
      additionalProperties: false
    Metrics:
      type: object
      properties:
        activeRuns:
          type: integer
          minimum: 0
        pendingDeliveries:
          type: integer
          minimum: 0
        unknownRuns:
          type: integer
          minimum: 0
        pendingApprovals:
          type: integer
          minimum: 0
        hostLagMs:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        desktopQuarantines:
          type: integer
          minimum: 0
      required:
      - activeRuns
      - pendingDeliveries
      - unknownRuns
      - pendingApprovals
      - hostLagMs
      - desktopQuarantines
      additionalProperties: false
    RuntimeTraceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        launchId:
          type: string
          format: uuid
        producerSeq:
          type: integer
          minimum: 1
        agentId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        runId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        nativeTurnId:
          anyOf:
          - type: string
          - type: 'null'
        kind:
          type: string
        lane:
          type: array
          items:
            type: string
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
      required:
      - id
      - launchId
      - producerSeq
      - agentId
      - sessionId
      - runId
      - nativeTurnId
      - kind
      - lane
      - occurredAt
      - payload
      additionalProperties: false
