components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: harbor_session
    hostBearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          format: uuid
      required:
      - code
      - message
      - retryable
      - requestId
      additionalProperties: false
    Actor:
      type: object
      properties:
        kind:
          type: string
          enum:
          - human
          - agent
          - system
        id:
          type: string
          format: uuid
        displayName:
          type: string
      required:
      - kind
      - id
      - displayName
      additionalProperties: false
    TextBlock:
      type: object
      properties:
        type:
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 65536
      required:
      - type
      - text
      additionalProperties: false
    ArtifactBlock:
      type: object
      properties:
        type:
          const: artifact
        artifactId:
          type: string
          format: uuid
        caption:
          type: string
      required:
      - type
      - artifactId
      additionalProperties: false
    Block:
      oneOf:
      - $ref: '#/components/schemas/TextBlock'
      - $ref: '#/components/schemas/ArtifactBlock'
    Budget:
      type: object
      properties:
        maxNativeTurns:
          type: integer
          minimum: 1
          maximum: 1000
        maxDepth:
          type: integer
          minimum: 1
          maximum: 32
        maxAgentFanout:
          type: integer
          minimum: 1
          maximum: 10
        wallTimeSec:
          type: integer
          minimum: 60
        softTokenLimit:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      required:
      - maxNativeTurns
      - maxDepth
      - maxAgentFanout
      - wallTimeSec
      - softTokenLimit
      additionalProperties: false
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
          enum:
          - active
          - paused
          - archived
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - state
      - version
      - createdAt
      additionalProperties: false
    CreateWorkspace:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - name
      additionalProperties: false
    WorkspaceControl:
      type: object
      properties:
        action:
          type: string
          enum:
          - pause
          - resume
        expectedVersion:
          type: integer
          minimum: 1
      required:
      - action
      - expectedVersion
      additionalProperties: false
    Host:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        architecture:
          type: string
        state:
          type: string
          enum:
          - online
          - offline
          - degraded
          - revoked
        lastSeenAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        bootId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        capabilities:
          type: array
          items:
            type: string
      required:
      - id
      - name
      - platform
      - architecture
      - state
      - lastSeenAt
      - bootId
      - capabilities
      additionalProperties: false
    PairHost:
      type: object
      properties:
        pairingCode:
          type: string
        hostName:
          type: string
        publicIdentity:
          type: string
      required:
      - pairingCode
      - hostName
      - publicIdentity
      additionalProperties: false
    HostEnrollment:
      type: object
      properties:
        hostId:
          type: string
          format: uuid
        hostCredential:
          type: string
        websocketPath:
          type: string
      required:
      - hostId
      - hostCredential
      - websocketPath
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        name:
          type: string
        rootPath:
          type: string
        baseRef:
          type: string
        workspaceMode:
          type: string
          enum:
          - directory
          - git-worktree
        version:
          type: integer
          minimum: 1
      required:
      - id
      - workspaceId
      - hostId
      - name
      - rootPath
      - baseRef
      - version
      additionalProperties: false
    CreateProject:
      type: object
      properties:
        hostId:
          type: string
          format: uuid
        name:
          type: string
        rootPath:
          type: string
          minLength: 1
        baseRef:
          type: string
        workspaceMode:
          type: string
          enum:
          - directory
          - git-worktree
        expectedVersion:
          type: integer
          minimum: 1
      required:
      - hostId
      - name
      - rootPath
      additionalProperties: false
    InitializeGit:
      type: object
      properties:
        rootPath:
          type: string
          minLength: 1
      required:
      - rootPath
      additionalProperties: false
    RuntimeConfig:
      type: object
      properties:
        driver:
          type: string
          enum:
          - codex-app-server
          - claude-code-sdk
        executableProfile:
          type: string
        model:
          type: string
        effort:
          anyOf:
          - type: string
          - type: 'null'
        permissionProfile:
          type: string
          enum:
          - review
          - workspace
          - desktop
          - read-only
          - ask-for-approval
          - auto-approve
          - full-access
        settingsProfile:
          type: string
      required:
      - driver
      - executableProfile
      - model
      - permissionProfile
      - settingsProfile
      additionalProperties: false
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        runtime:
          $ref: '#/components/schemas/RuntimeConfig'
        desiredState:
          type: string
          enum:
          - running
          - paused
          - stopped
        observedState:
          type: string
          enum:
          - stopped
          - starting
          - idle
          - working
          - waiting_approval
          - recovering
          - degraded
          - unknown
        capabilities:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
      required:
      - id
      - workspaceId
      - hostId
      - projectId
      - name
      - role
      - runtime
      - desiredState
      - observedState
      - capabilities
      - version
      additionalProperties: false
    CreateAgent:
      type: object
      properties:
        hostId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        role:
          type: string
        runtime:
          $ref: '#/components/schemas/RuntimeConfig'
        capabilities:
          type: array
          items:
            type: string
      required:
      - hostId
      - projectId
      - name
      - role
      - runtime
      additionalProperties: false
    AgentControl:
      type: object
      properties:
        action:
          type: string
          enum:
          - start
          - pause
          - resume
          - stop
          - reset_session
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
      required:
      - action
      - expectedVersion
      additionalProperties: false
    DeleteAgent:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 1
      required:
