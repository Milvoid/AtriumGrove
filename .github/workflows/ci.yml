name: Atrium Grove checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm install --prefix /tmp/harbor-ci-tools pnpm@11.19.0
      - run: echo '/tmp/harbor-ci-tools/node_modules/.bin' >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2
      - run: PATH="$PWD/node_modules/.bin:$PATH" python scripts/audit_spec.py --output /tmp/harbor-spec-audit.json
      - run: git diff --exit-code -- packages/contracts/src/domain.ts
